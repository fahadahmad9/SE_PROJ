<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Workout Plan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Add Workout Plan</h2>
<form th:action="@{/admin/workoutplan/add}" th:object="${workoutPlan}" method="post" class="mt-4">
  <div class="mb-3">
    <label>Name</label>
    <input type="text" th:field="*{name}" class="form-control" required>
  </div>
  <div class="mb-3">
    <label>Description</label>
    <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
  </div>
  <div class="mb-3">
    <label>Price</label>
    <input type="number" th:field="*{price}" step="0.01" class="form-control">
  </div>
  <button type="submit" class="btn btn-success">Save</button>
  <a href="/admin/workoutplans" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
