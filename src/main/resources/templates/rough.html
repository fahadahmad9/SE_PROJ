<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Workout Plan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h2 class="text-center mb-4">Add a New Workout Plan</h2>

  <form th:action="@{/user/save-workout-plan}" method="post" class="w-50 mx-auto bg-white p-4 rounded shadow-sm">
    <!-- Assuming user ID comes from session -->
    <input type="hidden" name="userId" th:value="${user.id}" />

    <div class="mb-3">
      <label for="name" class="form-label">Workout Plan Name</label>
      <input type="text" class="form-control" id="name" name="name" required />
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
    </div>

    <div class="mb-3">
      <label for="duration" class="form-label">Duration (in days)</label>
      <input type="number" class="form-control" id="duration" name="duration" min="1" required />
    </div>

    <button type="submit" class="btn btn-success w-100">Add Workout Plan</button>
  </form>

  <div class="text-center mt-4">
    <a href="/user/workouts" class="btn btn-secondary">Back to Workouts</a>
  </div>
</div>
</body>
</html>
