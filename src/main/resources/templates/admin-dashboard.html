<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h1 class="text-center mb-4">Admin Dashboard</h1>

  <div class="d-grid gap-3 col-6 mx-auto">
    <a href="/admin/pending" class="btn btn-primary btn-lg">View Pending User Registrations</a>
    <a href="/admin/workout" class="btn btn-success btn-lg">Manage Workouts</a>
    <a href="/admin/diet" class="btn btn-warning btn-lg">Manage Diets</a>
    <a href="/admin/logout" class="btn btn-danger btn-lg">Logout</a>
  </div>
  <h2>Admin Dashboard</h2>

  <div>
    <p>Total Users: <span th:text="${stats.totalUsers}"></span></p>
    <p>Total Trainers: <span th:text="${stats.totalTrainers}"></span></p>
    <p>Total Payments: <span th:text="${stats.totalPayments}"></span></p>
    <p>Total Earnings: $<span th:text="${stats.totalEarnings}"></span></p>
  </div>

  <canvas id="monthlyEarningsChart"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script th:inline="javascript">
    /*<![CDATA[*/
    var earningsData = /*[[${stats.monthlyEarnings}]]*/ {};
    var labels = Object.keys(earningsData);
    var values = Object.values(earningsData);

    var ctx = document.getElementById('monthlyEarningsChart').getContext('2d');
    var myChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Monthly Earnings',
          data: values,
          borderWidth: 2,
          fill: false,
          borderColor: 'blue'
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
    /*]]>*/
  </script>

</div>

</body>
</html>
