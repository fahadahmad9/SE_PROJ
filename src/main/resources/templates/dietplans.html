<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Diet Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Diet Plans</h2>
<a class="btn btn-primary mb-3" href="/admin/dietplan/add">Add New Diet Plan</a>
<table class="table table-striped">
  <thead>
  <tr>
    <th>Plan Name</th>
    <th>Description</th>
    <th>Price (if any)</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="dietPlan : ${dietPlans}">
    <td th:text="${dietPlan.name}">Plan Name</td>
    <td th:text="${dietPlan.description}">Description</td>
    <td th:text="${dietPlan.price}">Price</td>
    <td>
      <a th:href="@{'/admin/dietplan/edit/' + ${dietPlan.id}}" class="btn btn-warning btn-sm">Edit</a>
      <a th:href="@{'/admin/dietplan/delete/' + ${dietPlan.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this diet plan?')">Delete</a>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
