<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trainers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Trainers</h2>
<a class="btn btn-primary mb-3" href="/admin/trainer/add">Add New Trainer</a>
<table class="table table-striped">
    <thead>
    <tr>
        <th>Name</th>
        <th>Specialization</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="trainer : ${trainers}">
        <td th:text="${trainer.name}">Name</td>
        <td th:text="${trainer.specialization}">Specialization</td>
        <td>
            <a th:href="@{'/admin/trainer/edit/' + ${trainer.id}}" class="btn btn-warning btn-sm">Edit</a>
            <a th:href="@{'/admin/trainer/delete/' + ${trainer.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this trainer?')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
